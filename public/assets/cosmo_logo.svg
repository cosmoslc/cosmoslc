<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Livvic:wght@600;900&amp;display=swap');
      .logo-word{ font-family:'Livvic', Arial, sans-serif; font-weight:900; }
      .logo-tag{ font-family:'Livvic', Arial, sans-serif; font-weight:600; }
    </style>

    <!-- Website palette: primary #1B3BFF, deep #0A1454, accent #4F73FF -->
    <radialGradient id="sphereHighlight" cx="32%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#5C7BFF"/>
      <stop offset="45%" stop-color="#1B3BFF"/>
      <stop offset="100%" stop-color="#0A1454"/>
    </radialGradient>
    <linearGradient id="ringOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1454"/>
      <stop offset="50%" stop-color="#3C5BFF"/>
      <stop offset="100%" stop-color="#0A1454"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3BFF"/>
      <stop offset="100%" stop-color="#0A1454"/>
    </linearGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1454" flood-opacity="0.30"/>
    </filter>
    <filter id="ringShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A1454" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="1200" fill="#FFFFFF"/>

  <!-- Planet sphere -->
  <circle cx="600" cy="430" r="150" fill="url(#sphereHighlight)" filter="url(#softShadow)"/>

  <!-- Tilted ring passing in front of the sphere (clean edge, no stray circle line) -->
  <g transform="rotate(-33 600 430)" filter="url(#ringShadow)">
    <ellipse cx="600" cy="430" rx="272" ry="66" fill="#FFFFFF" stroke="url(#ringOutline)" stroke-width="5"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="805" text-anchor="middle" class="logo-word" font-size="192" letter-spacing="1" fill="url(#textGrad)">Cosmos</text>

  <!-- Tagline -->
  <text x="600" y="868" text-anchor="middle" class="logo-tag" font-size="46" letter-spacing="0.5" fill="#1B3BFF">O‘sha gap - natija muhim!</text>
</svg>
